<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b29"/>
      <stop offset="100%" stop-color="#06040f"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <!-- Rounded Cyber Badge Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="url(#neonCyan)" stroke-width="5"/>

  <!-- Left & Right Outer Wolf Ears -->
  <polygon points="20,62 16,14 52,38" fill="#1a1236" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="108,62 112,14 76,38" fill="#1a1236" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Pink Ear Floof -->
  <polygon points="25,54 23,24 46,40" fill="url(#neonPink)"/>
  <polygon points="103,54 105,24 82,40" fill="url(#neonPink)"/>

  <!-- Cheek Ruff / Furry Wolf Mane -->
  <polygon points="12,72 26,54 102,54 116,72 98,86 106,96 64,116 22,96 30,86" fill="#181030" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Forehead Crown Tuft -->
  <polygon points="52,38 64,22 76,38 64,46" fill="#00f3ff"/>

  <!-- Wolf Muzzle Bridge -->
  <polygon points="46,56 64,42 82,56 74,98 64,108 54,98" fill="#231742" stroke="#ff80ab" stroke-width="3" stroke-linejoin="round"/>

  <!-- Glowing Cyber Wolf Eyes -->
  <polygon points="33,66 53,62 49,73 35,72" fill="#00f3ff"/>
  <polygon points="95,66 75,62 79,73 93,72" fill="#00f3ff"/>

  <!-- Boopable Cyber Snoot / Nose -->
  <polygon points="55,92 73,92 64,104" fill="url(#neonPink)"/>
</svg>

